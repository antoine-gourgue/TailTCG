# Chaque nuit : régénère l'instantané des sets jouables (liste + cartes de
# chaque set) depuis TCGdex, les logos de sets que TCGdex n'a pas, le
# catalogue en base (TCGdex + Limitless + pokemontcg.io), l'index pHash du
# scan (src/data, committé) et l'index neural du scan (embeddings MobileCLIP
# téléversés sur Supabase Storage), puis committe ce qui a changé. Vercel
# redéploie sur le push.
name: Sets jouables, catalogue, logos et index du scan

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playable-sets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances (sharp pour les empreintes et les logos)
        run: npm ci --no-audit --no-fund
      - name: Régénérer l'instantané des sets jouables
        run: node scripts/playable-sets.mjs
      - name: Logos des sets (nouveaux seulement)
        run: node scripts/set-logos.mjs
      - name: Catalogue en base (TCGdex, Limitless, pokemontcg.io)
        run: node scripts/catalog-sync.mjs
      - name: Compléter l'index du scan (nouvelles cartes seulement)
        run: node scripts/scan-index.mjs
      - name: Committer s'il y a du nouveau
        run: |
          if [ -n "$(git status --porcelain src/data public/set-logos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data public/set-logos
            git commit -m "Catalogue : instantané, logos et index du scan mis à jour ($(date -u +%F))"
            git push
          else
            echo "Aucun changement."
          fi
      # Après le commit pHash (découplé) : l'index neural va sur Supabase
      # Storage, pas dans git ; un échec ici ne doit pas bloquer le reste.
      - name: Compléter l'index neural du scan (nouvelles cartes → Supabase Storage)
        continue-on-error: true
        run: node scripts/scan-embed-index.mjs --max=8000
